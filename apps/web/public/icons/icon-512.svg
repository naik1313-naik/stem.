<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12766B"/>
      <stop offset="100%" stop-color="#D9622B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <!-- Battery icon representing physics/electricity -->
    <rect x="-80" y="-40" width="160" height="80" rx="16" fill="none" stroke="white" stroke-width="12"/>
    <rect x="80" y="-20" width="24" height="40" rx="4" fill="white"/>
    <rect x="-72" y="-32" width="48" height="64" rx="8" fill="white" opacity="0.3"/>
    <text x="0" y="12" text-anchor="middle" fill="white" font-size="28" font-weight="900" font-family="system-ui">⚡</text>
    <!-- Atom/orbit representing science -->
    <circle r="100" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
    <ellipse rx="100" ry="35" fill="none" stroke="white" stroke-width="4" opacity="0.3" transform="rotate(60)"/>
    <ellipse rx="100" ry="35" fill="none" stroke="white" stroke-width="4" opacity="0.3" transform="rotate(-60)"/>
    <circle r="16" fill="white"/>
  </g>
</svg>